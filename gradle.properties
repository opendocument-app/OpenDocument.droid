# A release build runs R8 for one flavor while bundletool is re-zipping the other
# flavor's signed .aab, and with ndk.debugSymbolLevel = "full" that .aab carries
# unstripped symbols for four ABIs, which AabFlinger buffers in memory. 1536M OOM'd
# on exactly that overlap. CI runners have 16G, so the old value was not buying
# anything.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# https://docs.gradle.org/current/userguide/configuration_cache.html - a cache hit skips
# the configuration phase outright.
org.gradle.configuration-cache=true
