version: 2

updates:
  # reads gradle/libs.versions.toml, so a bump is a one line change in the catalog
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # first match in file order wins, so the narrower group has to come first
      test:
        patterns:
          - "androidx.test*"
          - "androidx.test.espresso*"
          - "junit*"
      androidx:
        patterns:
          - "androidx.*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # fastlane and its dependencies
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
