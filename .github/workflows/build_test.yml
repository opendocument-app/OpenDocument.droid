name: build_test

on:
  workflow_dispatch:
  # branch pushes are covered by the pull_request trigger, so only main is built
  # directly - otherwise every push to a branch with an open PR builds twice
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'fastlane/metadata/**'
      - '.github/FUNDING.yml'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'fastlane/metadata/**'
      - '.github/FUNDING.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # required to publish lint findings to the code scanning tab
  security-events: write

env:
  ndk_version: 28.2.13676358

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      conan-cache-key: ${{ steps.conan-cache-key.outputs.key }}
    steps:
    - name: checkout
      uses: actions/checkout@v4

    - name: install ninja
      run: sudo apt-get install -y ninja-build

    - name: setup java
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: 21

    - name: setup python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: 3.12
    - name: install python dependencies
      run: pip install conan

    - name: install ndk
      run: yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;${{ env.ndk_version }}"

    - name: conan profile
      run: conan profile detect

    - name: checkout conan-index
      run: git submodule update --init --depth 1 conan-odr-index

    - name: conan cache key
      id: conan-cache-key
      run: echo "key=conan2-${{ runner.os }}-ndk${{ env.ndk_version }}-index$(git rev-parse HEAD:conan-odr-index)-${{ hashFiles('app/conanfile.txt', 'app/conanprofile.txt') }}" >> "$GITHUB_OUTPUT"

    # restore before exporting the recipes: the export must run on top of the
    # restored cache so current recipes win over stale ones from the archive
    - name: conan cache
      uses: actions/cache@v4
      with:
        path: ~/.conan2/p
        key: ${{ steps.conan-cache-key.outputs.key }}
        restore-keys: |
          conan2-${{ runner.os }}-ndk${{ env.ndk_version }}-

    - name: export conan-odr-index
      run: python conan-odr-index/scripts/conan_export_all_packages.py

    - name: Gradle cache
      uses: gradle/actions/setup-gradle@v4

    - name: gradle
      run: ./gradlew assembleDebug testProDebugUnitTest lintProDebug lintLiteDebug --stacktrace

    # drop temporary download/source/build folders so only built packages get cached
    - name: clean conan cache
      run: conan cache clean "*"

    - name: conan cache size
      run: du -h -d1 ~/.conan2/p

    - name: Artifact APKs
      uses: actions/upload-artifact@v4
      with:
        name: APKs
        path: app/build/outputs/apk/**/*.apk
        if-no-files-found: error
        compression-level: 0

    # lint failures fail the gradle step above, so these have to run regardless
    - name: Upload lint results to code scanning
      if: always()
      # fork PRs get a read-only token and cannot write code scanning results;
      # the html artifact below is the fallback in that case
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: app/build/reports
        category: android-lint

    - name: Artifact lint results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: lint-report
        path: app/build/reports/lint-results-*.html
        if-no-files-found: warn

    - name: Artifact unit test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: unit-test-results
        path: app/build/reports/tests/
        if-no-files-found: warn

  test:
    runs-on: ubuntu-24.04
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          # api 26 is minSdk - the floor was previously untested, which is part of
          # why an API 26+ only call could ship in a path only old devices took.
          # (the old api 23 entry was disabled for issue #390 and is now moot)
          - { arch: x86_64, api-level: 26 }
          - { arch: x86_64, api-level: 29 }
          - { arch: x86_64, api-level: 30 }
          - { arch: x86_64, api-level: 32 }
          - { arch: x86_64, api-level: 34 }
    steps:
    - name: checkout
      uses: actions/checkout@v4

    - name: install ninja
      run: sudo apt-get install -y ninja-build

    - name: java
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: 21

    - name: setup python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: 3.12
    - name: install python dependencies
      run: pip install conan

    - name: install ndk
      run: yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;${{ env.ndk_version }}"

    - name: conan profile
      run: conan profile detect

    - name: checkout conan-index
      run: git submodule update --init --depth 1 conan-odr-index

    # restore the packages built by the build job. on a cache hit no conan
    # package needs to be rebuilt or downloaded; on a miss everything is
    # built from source via the exported recipes (slow but reliable).
    # restore before exporting the recipes so current recipes win over
    # stale ones from the archive
    - name: conan cache
      uses: actions/cache/restore@v4
      with:
        path: ~/.conan2/p
        key: ${{ needs.build.outputs.conan-cache-key }}
        restore-keys: |
          conan2-${{ runner.os }}-ndk${{ env.ndk_version }}-

    - name: export conan-odr-index
      run: python conan-odr-index/scripts/conan_export_all_packages.py

    - name: Gradle cache
      uses: gradle/actions/setup-gradle@v4

    - name: AVD cache
      uses: actions/cache@v4
      id: avd-cache
      with:
        path: |
          ~/.android/avd/*
          ~/.android/adb*
        key: avd-${{ matrix.api-level }}-v3

    - name: Enable KVM group perms
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Create AVD and generate snapshot for caching
      if: steps.avd-cache.outputs.cache-hit != 'true'
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: ${{ matrix.api-level }}
        arch: ${{ matrix.arch }}
        target: google_apis
        force-avd-creation: false
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
        disable-animations: false
        script: echo "Generated AVD snapshot for caching."

    - name: Run tests
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: ${{ matrix.api-level }}
        arch: ${{ matrix.arch }}
        target: google_apis
        force-avd-creation: false
        emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
        disable-animations: true
        script: |
          # Clear logcat before tests. Fails with "failed to clear the 'main' log"
          # on some system images (api 26 among them) and must not abort the run.
          adb logcat -c || true

          # Run tests
          ./gradlew connectedCheck

          # Dump logcat after tests
          adb logcat -d > logcat.txt

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.api-level }}
        path: |
          app/build/reports/androidTests/
          app/build/outputs/androidTest-results/
        if-no-files-found: warn

    - name: Upload test logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-logs-${{ matrix.api-level }}
        path: |
          app/build/outputs/logs/
          app/build/test-results/
        if-no-files-found: warn

    - name: Upload emulator logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: emulator-logs-${{ matrix.api-level }}
        path: |
          ~/.android/avd/*.avd/config.ini
          ~/.android/avd/*.avd/*.log
          logcat.txt
        if-no-files-found: warn
