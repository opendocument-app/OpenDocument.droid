name: build_test

on:
  workflow_dispatch:
  # branch pushes are covered by the pull_request trigger, so only main is built
  # directly - otherwise every push to a branch with an open PR builds twice
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'fastlane/metadata/**'
      - '.github/FUNDING.yml'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'fastlane/metadata/**'
      - '.github/FUNDING.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # required to publish lint findings to the code scanning tab
  security-events: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - name: checkout
      uses: actions/checkout@v7

    - name: setup java
      uses: actions/setup-java@v6.0.0
      with:
        distribution: 'zulu'
        java-version: 21

    - name: Gradle cache
      uses: gradle/actions/setup-gradle@v6

    - name: gradle
      # spotlessCheck runs in the format workflow, which has no paths-ignore
      run: ./gradlew assembleDebug testProDebugUnitTest lintProDebug lintLiteDebug --stacktrace

    - name: Artifact APKs
      uses: actions/upload-artifact@v7
      with:
        name: APKs
        path: app/build/outputs/apk/**/*.apk
        if-no-files-found: error
        compression-level: 0

    # lint failures fail the gradle step above, so these have to run regardless
    - name: Upload lint results to code scanning
      if: always()
      # fork PRs get a read-only token and cannot write code scanning results;
      # the html artifact below is the fallback in that case
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@v4.37.9
      with:
        sarif_file: app/build/reports
        category: android-lint

    - name: Artifact lint results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: lint-report
        path: app/build/reports/lint-results-*.html
        if-no-files-found: warn

    - name: Artifact unit test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: unit-test-results
        path: app/build/reports/tests/
        if-no-files-found: warn

  test:
    runs-on: ubuntu-24.04
    needs: build
    # a job that wedges instead of failing would otherwise sit here until github's
    # 6h limit. the whole job takes about 10 minutes when the emulator behaves
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # api 26 is minSdk: the floor was untested, which is how an API 26+ only
          # call shipped in a path only old devices took
          - { arch: x86_64, api-level: 26 }
          - { arch: x86_64, api-level: 29 }
          - { arch: x86_64, api-level: 30 }
          - { arch: x86_64, api-level: 32 }
          - { arch: x86_64, api-level: 34 }
    steps:
    - name: checkout
      uses: actions/checkout@v7

    - name: java
      uses: actions/setup-java@v6.0.0
      with:
        distribution: 'zulu'
        java-version: 21

    - name: Gradle cache
      uses: gradle/actions/setup-gradle@v6

    - name: AVD cache
      uses: actions/cache@v6
      id: avd-cache
      with:
        path: |
          ~/.android/avd/*
          ~/.android/adb*
        # the avd itself, not its snapshot - the test step boots cold. bump the suffix
        # whenever what is in here changes; v4 was the ram bump
        key: avd-${{ matrix.api-level }}-v4

    - name: Enable KVM group perms
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    # detached on purpose: the step that hangs is the one running the emulator, so
    # nothing that comes after it in this job would ever get to run. see the script
    - name: Reap the emulator's crash reporter
      run: nohup setsid bash .github/scripts/reap-crashpad.sh > /dev/null 2>&1 &

    - name: Create AVD and generate snapshot for caching
      if: steps.avd-cache.outputs.cache-hit != 'true'
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: ${{ matrix.api-level }}
        arch: ${{ matrix.arch }}
        target: google_apis
        force-avd-creation: false
        # the images default to 1536MB, tight enough that the action's first adb command
        # got killed mid-boot ("input keyevent 82" exiting 137). the runner has 16GB
        ram-size: 4096M
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
        disable-animations: false
        script: echo "Generated AVD snapshot for caching."

    - name: Run tests
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: ${{ matrix.api-level }}
        arch: ${{ matrix.arch }}
        target: google_apis
        force-avd-creation: false
        ram-size: 4096M
        # -no-snapshot-load: the action runs "input keyevent 82" as soon as
        # sys.boot_completed is set, which a guest still thawing out of a snapshot fails
        # (SIGKILL, or "No service published for: input"). a cold boot costs a minute
        emulator-options: -no-snapshot-save -no-snapshot-load -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
        disable-animations: true
        # one line on purpose: the action runs this input line by line, each in its
        # own "sh -c", so anything with shell state has to be in the script itself
        script: bash .github/scripts/run-instrumented-tests.sh

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results-${{ matrix.api-level }}
        path: |
          app/build/reports/androidTests/
          app/build/outputs/androidTest-results/
          app/build/outputs/connected_android_test_additional_output/
        if-no-files-found: warn

    - name: Upload test logs
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-logs-${{ matrix.api-level }}
        path: app/build/outputs/logs/
        if-no-files-found: warn

    - name: Upload emulator logs
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: emulator-logs-${{ matrix.api-level }}
        path: |
          ~/.android/avd/*.avd/config.ini
          ~/.android/avd/*.avd/*.log
          logcat.txt
          processes.txt
          anr-traces.txt
          tombstones.txt
        if-no-files-found: warn
