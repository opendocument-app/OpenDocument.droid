name: build_test

on:
  workflow_dispatch:
  # branch pushes are covered by the pull_request trigger, so only main is built
  # directly - otherwise every push to a branch with an open PR builds twice
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'fastlane/metadata/**'
      - '.github/FUNDING.yml'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'fastlane/metadata/**'
      - '.github/FUNDING.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # required to publish lint findings to the code scanning tab
  security-events: write

env:
  ndk_version: 28.2.13676358

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      conan-cache-key: ${{ steps.conan-cache-key.outputs.key }}
    steps:
    - name: checkout
      uses: actions/checkout@v4

    - name: install ninja
      run: sudo apt-get install -y ninja-build

    - name: setup java
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: 21

    - name: setup python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: 3.12
    - name: install python dependencies
      run: pip install conan

    - name: install ndk
      run: yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;${{ env.ndk_version }}"

    - name: conan profile
      run: conan profile detect

    - name: checkout conan-index
      run: git submodule update --init --depth 1 conan-odr-index

    - name: conan cache key
      id: conan-cache-key
      run: echo "key=conan2-${{ runner.os }}-ndk${{ env.ndk_version }}-index$(git rev-parse HEAD:conan-odr-index)-${{ hashFiles('app/conanfile.txt', 'app/conanprofile.txt') }}" >> "$GITHUB_OUTPUT"

    # restore before exporting the recipes: the export must run on top of the
    # restored cache so current recipes win over stale ones from the archive
    - name: conan cache
      uses: actions/cache@v6
      with:
        path: ~/.conan2/p
        key: ${{ steps.conan-cache-key.outputs.key }}
        restore-keys: |
          conan2-${{ runner.os }}-ndk${{ env.ndk_version }}-

    - name: export conan-odr-index
      run: python conan-odr-index/scripts/conan_export_all_packages.py

    - name: Gradle cache
      uses: gradle/actions/setup-gradle@v4

    - name: gradle
      # spotlessCheck runs in the format workflow, which has no paths-ignore
      run: ./gradlew assembleDebug testProDebugUnitTest lintProDebug lintLiteDebug --stacktrace

    # drop temporary download/source/build folders so only built packages get cached
    - name: clean conan cache
      run: conan cache clean "*"

    - name: conan cache size
      run: du -h -d1 ~/.conan2/p

    - name: Artifact APKs
      uses: actions/upload-artifact@v7
      with:
        name: APKs
        path: app/build/outputs/apk/**/*.apk
        if-no-files-found: error
        compression-level: 0

    # lint failures fail the gradle step above, so these have to run regardless
    - name: Upload lint results to code scanning
      if: always()
      # fork PRs get a read-only token and cannot write code scanning results;
      # the html artifact below is the fallback in that case
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: app/build/reports
        category: android-lint

    - name: Artifact lint results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: lint-report
        path: app/build/reports/lint-results-*.html
        if-no-files-found: warn

    - name: Artifact unit test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: unit-test-results
        path: app/build/reports/tests/
        if-no-files-found: warn

  test:
    runs-on: ubuntu-24.04
    needs: build
    # a job that wedges instead of failing would otherwise sit here until github's
    # 6h limit. the whole job takes about 10 minutes when the emulator behaves
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # api 26 is minSdk - the floor was previously untested, which is part of
          # why an API 26+ only call could ship in a path only old devices took.
          # (the old api 23 entry was disabled for issue #390 and is now moot)
          - { arch: x86_64, api-level: 26 }
          - { arch: x86_64, api-level: 29 }
          - { arch: x86_64, api-level: 30 }
          - { arch: x86_64, api-level: 32 }
          - { arch: x86_64, api-level: 34 }
    steps:
    - name: checkout
      uses: actions/checkout@v4

    - name: install ninja
      run: sudo apt-get install -y ninja-build

    - name: java
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: 21

    - name: setup python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: 3.12
    - name: install python dependencies
      run: pip install conan

    - name: install ndk
      run: yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;${{ env.ndk_version }}"

    - name: conan profile
      run: conan profile detect

    - name: checkout conan-index
      run: git submodule update --init --depth 1 conan-odr-index

    # restore the packages built by the build job. on a cache hit no conan
    # package needs to be rebuilt or downloaded; on a miss everything is
    # built from source via the exported recipes (slow but reliable).
    # restore before exporting the recipes so current recipes win over
    # stale ones from the archive
    - name: conan cache
      uses: actions/cache/restore@v6
      with:
        path: ~/.conan2/p
        key: ${{ needs.build.outputs.conan-cache-key }}
        restore-keys: |
          conan2-${{ runner.os }}-ndk${{ env.ndk_version }}-

    - name: export conan-odr-index
      run: python conan-odr-index/scripts/conan_export_all_packages.py

    - name: Gradle cache
      uses: gradle/actions/setup-gradle@v4

    - name: AVD cache
      uses: actions/cache@v6
      id: avd-cache
      with:
        path: |
          ~/.android/avd/*
          ~/.android/adb*
        # what gets cached is a booted snapshot, so it pins the guest's memory image to
        # the ram size it was taken at - this key has to change whenever that does. the
        # bump also throws the api 26 snapshot away, which is the one that kept dying
        key: avd-${{ matrix.api-level }}-v4

    - name: Enable KVM group perms
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Create AVD and generate snapshot for caching
      if: steps.avd-cache.outputs.cache-hit != 'true'
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: ${{ matrix.api-level }}
        arch: ${{ matrix.arch }}
        target: google_apis
        force-avd-creation: false
        # the images default to 1536MB, which left the guest so tight that the first adb
        # command after a snapshot restore got killed while the system was still thawing
        # ("input keyevent 82" exiting 137, api 26 mostly). the runner has 16GB, so the
        # headroom is free
        ram-size: 4096M
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
        disable-animations: false
        script: echo "Generated AVD snapshot for caching."

    - name: Run tests
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: ${{ matrix.api-level }}
        arch: ${{ matrix.arch }}
        target: google_apis
        force-avd-creation: false
        ram-size: 4096M
        emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
        disable-animations: true
        script: |
          # Clear logcat before tests. Fails with "failed to clear the 'main' log"
          # on some system images (api 26 among them) and must not abort the run.
          adb logcat -c || true

          status=0
          # the test run takes about 4 minutes; anything past 20 is hung, and a hang
          # has to end as a normal failure so the logcat below still gets dumped and
          # uploaded - that is the only view into what the guest was doing
          timeout --kill-after=1m 20m ./gradlew connectedCheck || status=$?

          # Dump logcat after tests. This used to sit after a bare gradle call, so the
          # only runs whose logs were worth uploading were the ones that never got here -
          # "||" keeps it reachable without swallowing the failure.
          adb logcat -d > logcat.txt

          # a hung run says nothing about which test wedged, so add what the device
          # still knows: anrs and tombstones, plus whether our processes are alive
          if [ "$status" = 124 ] || [ "$status" = 137 ]; then
            adb shell ps -A > processes.txt 2>&1 || true
            adb shell "cat /data/anr/*trace* 2>/dev/null" > anr-traces.txt || true
            adb shell "ls -l /data/tombstones 2>/dev/null" > tombstones.txt || true
          fi

          # the step cannot end while the emulator the action started still holds its
          # output open, and the action's own teardown only sends "adb emu kill" without
          # checking that anything came of it. on api 26 and 29 nothing does often enough
          # to matter - both hung for 40 minutes after a finished test run, one of them
          # green - so kill it here, hard if the polite request is ignored again
          adb emu kill || true
          for _ in $(seq 20); do
            pgrep -f qemu-system > /dev/null || break
            sleep 1
          done
          pkill -9 -f qemu-system || true

          exit $status

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results-${{ matrix.api-level }}
        path: |
          app/build/reports/androidTests/
          app/build/outputs/androidTest-results/
        if-no-files-found: warn

    - name: Upload test logs
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-logs-${{ matrix.api-level }}
        path: |
          app/build/outputs/logs/
          app/build/test-results/
        if-no-files-found: warn

    - name: Upload emulator logs
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: emulator-logs-${{ matrix.api-level }}
        path: |
          ~/.android/avd/*.avd/config.ini
          ~/.android/avd/*.avd/*.log
          logcat.txt
          processes.txt
          anr-traces.txt
          tombstones.txt
        if-no-files-found: warn
