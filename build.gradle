plugins {
    alias(libs.plugins.android.application) apply false
    alias(libs.plugins.spotless)
}

// ./gradlew spotlessApply to fix, spotlessCheck to verify (CI does).
spotless {
    java {
        target 'app/src/*/java/**/*.java'

        googleJavaFormat(libs.versions.googleJavaFormat.get()).aosp().reflowLongStrings()
        removeUnusedImports()
        formatAnnotations()
        trimTrailingWhitespace()
        endWithNewline()
    }

    kotlin {
        target 'app/src/*/java/**/*.kt'

        ktfmt(libs.versions.ktfmt.get()).kotlinlangStyle()
        trimTrailingWhitespace()
        endWithNewline()
    }

    format 'misc', {
        // deliberately explicit: a '**/*.yml' style glob also matches generated
        // output under build/
        target '*.gradle', 'app/*.gradle', 'gradle/*.toml', '*.md', '.gitignore',
                '.github/**/*.yml', '_config.yml', '*.sh',
                '.github/scripts/*', 'tools/**/*.sh', 'tools/**/*.py'
        targetExclude '**/build/**'

        trimTrailingWhitespace()
        endWithNewline()
    }
}
