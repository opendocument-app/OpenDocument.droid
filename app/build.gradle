plugins {
    alias(libs.plugins.android.application)
}

// Release signing is optional. Empty credentials count as absent; see README.
def signingSetting = { String property, String environmentVariable ->
    providers.gradleProperty(property)
            .orElse(providers.environmentVariable(environmentVariable))
            .filter { !it.isEmpty() }
}
def releaseKeystore = signingSetting('odr.keystore', 'ODR_KEYSTORE')
def releaseKeystorePassword = signingSetting('odr.keystorePassword', 'ODR_KEYSTORE_PASSWORD')
def releaseKeyPasswordPro = signingSetting('odr.keyPasswordPro', 'ODR_KEY_PASSWORD_PRO')
def releaseKeyPasswordLite = signingSetting('odr.keyPasswordLite', 'ODR_KEY_PASSWORD_LITE')
def hasReleaseSigning = releaseKeystore.isPresent() && releaseKeystorePassword.isPresent()

// Release versions come from odr.version or ODR_VERSION; other builds use 0.0.0.
def parseVersion = { String version ->
    // split rather than tokenize, which would swallow the empty part in '4..8'
    def parts = (version - ~/^v/).split('\\.', -1) as List
    // Require all three components; never pad missing version parts.
    if (parts.size() != 3 || !parts.every { it ==~ /\d+/ }) {
        throw new GradleException(
                "odr.version must look like 4.8.0 or v4.8.0, not '${version}'")
    }
    def numbers = parts*.toInteger()
    // Encode each component in two digits: 4.8.0 becomes 40800.
    if (numbers.any { it > 99 }) {
        // Reject components that would collide in the version code.
        throw new GradleException("every part of '${version}' has to be below 100 for the " +
                "two-digits-per-part version code to stay unambiguous")
    }
    [name: numbers.join('.'), code: numbers[0] * 10000 + numbers[1] * 100 + numbers[2]]
}
def requestedVersion = providers.gradleProperty('odr.version')
        .orElse(providers.environmentVariable('ODR_VERSION'))
        .filter { !it.isEmpty() }
// spelled out rather than parsed from '0.0.0', because the formula would make that
// version code 0 and AGP insists on a positive one
def appVersion = requestedVersion.isPresent()
        ? parseVersion(requestedVersion.get())
        : [name: '0.0.0', code: 1]

// No NDK here, and no ndkVersion: the app compiles no native code of its own, and
// libodr_jni.so arrives prebuilt for every ABI inside the odr-core-android AAR.

android {
    defaultConfig {
        // Published application ID; changing it breaks upgrades.
        applicationId = "at.tomtasche.reader"
        minSdk = 26
        targetSdk = 36

        // here rather than in AndroidManifest.xml: this one wins in the merged manifest,
        // so a copy there could only ever disagree
        versionCode = appVersion.code
        versionName = appVersion.name

        // likewise an applicationId, for the test apk. never published, so it is only
        // pinned here to keep it from drifting with the namespace.
        testApplicationId = "at.tomtasche.reader.test"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    flavorDimensions = ["default"]

    signingConfigs {
        if (hasReleaseSigning) {
            releasePro {
                storeFile = file(releaseKeystore.get())
                storePassword = releaseKeystorePassword.get()
                keyAlias = "reader-pro"
                keyPassword = releaseKeyPasswordPro.getOrElse(releaseKeystorePassword.get())
            }

            releaseLite {
                storeFile = file(releaseKeystore.get())
                storePassword = releaseKeystorePassword.get()
                keyAlias = "reader"
                keyPassword = releaseKeyPasswordLite.getOrElse(releaseKeystorePassword.get())
            }
        }
    }

    productFlavors {
        lite {
            if (hasReleaseSigning) {
                signingConfig = signingConfigs.releaseLite
            }
        }

        pro {
            applicationIdSuffix = ".pro"

            if (hasReleaseSigning) {
                signingConfig = signingConfigs.releasePro
            }
        }

        // pro without the play in-app review sheet, so it links nothing proprietary:
        // the apk on the github release, and what f-droid builds
        foss {
            applicationIdSuffix = ".foss"

            if (hasReleaseSigning) {
                signingConfig = signingConfigs.releaseLite
            }
        }
    }

    // Each flavor links ads/review implementations or matching no-ops. Kotlin sources require
    // kotlin.srcDirs.
    sourceSets {
        getByName('lite') { kotlin.srcDirs += ['src/ads/java', 'src/review/java'] }
        getByName('pro') { kotlin.srcDirs += ['src/noAds/java', 'src/review/java'] }
        getByName('foss') { kotlin.srcDirs += ['src/noAds/java', 'src/noReview/java'] }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.txt'
            ndk.debugSymbolLevel = "full"
        }
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    lint {
        // Fail builds on lint errors, including APIs unavailable at minSdk.
        abortOnError = true

        // warnings stay warnings for now - there is a backlog of them (unused
        // resources, typography, rtl) that is not worth blocking builds on
        warningsAsErrors = false

        // consumed by github code scanning, so findings show up inline on PRs
        sarifReport = true
        htmlReport = true
    }
    buildFeatures {
        buildConfig = true
    }
    // Internal package for Kotlin, R, and BuildConfig; independent of applicationId.
    namespace = 'app.opendocument.droid'
    // ahead of targetSdk on purpose: compiling against newer APIs is independent of
    // opting in to their runtime behavior. androidx.core 1.19.0 requires 37.
    compileSdk = 37
}

dependencies {
    // odrcore's JNI bindings, java and native in one AAR (see settings.gradle)
    implementation libs.odr.core.android

    // Only Lite links the ad and consent SDKs; Foss links no Play SDKs.
    liteImplementation libs.play.services.ads
    liteImplementation libs.user.messaging.platform
    liteImplementation libs.play.review
    proImplementation libs.play.review

    implementation libs.androidx.appcompat
    implementation libs.androidx.core
    implementation libs.material
    implementation libs.androidx.webkit
    implementation libs.androidx.recyclerview
    implementation libs.androidx.lifecycle.viewmodel
    implementation libs.androidx.lifecycle.livedata

    testImplementation libs.junit

    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.espresso.intents
    // RecyclerViewActions: the landing screen is one list, and what a test wants to reach
    // is regularly a row that has not been bound yet on a small screen
    androidTestImplementation libs.espresso.contrib
    androidTestImplementation libs.androidx.test.rules
    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation libs.androidx.test.junit
    // only the debug variant of OpenFileIdling touches espresso, so the release apk
    // does not ship test infrastructure
    debugImplementation libs.espresso.idling.resource
    implementation libs.androidx.annotation
}
