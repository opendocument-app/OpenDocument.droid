import org.apache.tools.ant.filters.ReplaceTokens

plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.conan.android)
}

// Release signing credentials are supplied out of band - they used to be committed
// in plain text right here. Set them either as gradle properties (in
// ~/.gradle/gradle.properties, never in the repo) or as environment variables:
//
//   odr.keystore         / ODR_KEYSTORE          path to the keystore
//   odr.keystorePassword / ODR_KEYSTORE_PASSWORD store password
//   odr.keyPasswordPro   / ODR_KEY_PASSWORD_PRO  key password, defaults to the store one
//   odr.keyPasswordLite  / ODR_KEY_PASSWORD_LITE key password, defaults to the store one
//
// When they are absent the release variants build unsigned instead of failing, so
// contributors and CI can still build them.
// empty counts as absent: a github actions secret that is not set still reaches the
// build as an empty environment variable, and taking that at face value would use an
// empty key password instead of falling back to the store one
def signingSetting = { String property, String environmentVariable ->
    providers.gradleProperty(property)
            .orElse(providers.environmentVariable(environmentVariable))
            .filter { !it.isEmpty() }
}
def releaseKeystore = signingSetting('odr.keystore', 'ODR_KEYSTORE')
def releaseKeystorePassword = signingSetting('odr.keystorePassword', 'ODR_KEYSTORE_PASSWORD')
def releaseKeyPasswordPro = signingSetting('odr.keyPasswordPro', 'ODR_KEY_PASSWORD_PRO')
def releaseKeyPasswordLite = signingSetting('odr.keyPasswordLite', 'ODR_KEY_PASSWORD_LITE')
def hasReleaseSigning = releaseKeystore.isPresent() && releaseKeystorePassword.isPresent()

// The version is the tag, and lives nowhere in the tree. A number checked in on main
// describes either a release that already went out or a guess at the next one, so it is
// wrong almost all of the time, and versionCode and versionName had to be walked forward
// together by hand. The release workflow passes the tag it was triggered by as
// -Podr.version (ODR_VERSION works too, the way the signing settings above take either).
//
// Everything else - a local build, a PR build, a dry run - is 0.0.0, which nothing reads:
// no code in the app looks at its own version, and only what the release workflow builds
// is ever uploaded anywhere.
def parseVersion = { String version ->
    // split rather than tokenize, which would swallow the empty part in '4..8'
    def parts = (version - ~/^v/).split('\\.', -1) as List
    if (parts.isEmpty() || parts.size() > 3 || !parts.every { it ==~ /\d+/ }) {
        throw new GradleException(
                "odr.version must look like 4.8 or v4.8.0, not '${version}'")
    }
    def numbers = parts*.toInteger()
    while (numbers.size() < 3) {
        numbers << 0
    }
    // two digits per component: v4.8.0 is 40800. That is a one way step past the codes
    // that used to be counted by hand (204 and below) - the play store accepts a higher
    // code than the last one it saw and never a lower one.
    if (numbers.any { it > 99 }) {
        // silently carrying would make 4.100.0 and 5.0.0 the same code, and a collision
        // is only discoverable once the store rejects the upload
        throw new GradleException("every part of '${version}' has to be below 100 for the " +
                "two-digits-per-part version code to stay unambiguous")
    }
    [name: numbers.join('.'), code: numbers[0] * 10000 + numbers[1] * 100 + numbers[2]]
}
def requestedVersion = providers.gradleProperty('odr.version')
        .orElse(providers.environmentVariable('ODR_VERSION'))
        .filter { !it.isEmpty() }
// spelled out rather than parsed from '0.0.0', because the formula would make that
// version code 0 and AGP insists on a positive one
def appVersion = requestedVersion.isPresent()
        ? parseVersion(requestedVersion.get())
        : [name: '0.0.0', code: 1]

android {
    ndkVersion = "28.2.13676358"
}

// conan is taken from PATH by default. Point odr.conanExecutable (or ODR_CONAN) at a
// specific binary when it lives in a virtualenv that is not on the gradle daemon's
// PATH - the daemon captures its environment at startup, so a venv activated in the
// shell afterwards is not visible to it.
def conanExecutable_ = providers.gradleProperty('odr.conanExecutable')
        .orElse(providers.environmentVariable('ODR_CONAN'))
        .getOrElse('conan')

// android.ndkDirectory was removed in AGP 9; the ndk location now comes from the
// androidComponents sdk components provider
def ndkDirectory = androidComponents.sdkComponents.ndkDirectory.map { it.asFile.toString() }

tasks.register('conanProfile', Copy) {
    from "conanprofile.txt"
    into project.layout.buildDirectory
    inputs.property("ndkDirectory", ndkDirectory)
    filter(ReplaceTokens, tokens: ["NDK_PATH": ndkDirectory.get()])
}

["armv8", "armv7", "x86", "x86_64"].each { architecture ->
    tasks.named("conanInstall-" + architecture) {
        profile.set('build/conanprofile.txt')
        deployer.set('conandeployer.py')
        // the deployer lays out both assets/core and jniLibs/<abi> underneath this
        deployerFolder.set(outputDirectory.get().asFile.toString())
        dependsOn(tasks.named('conanProfile'))
        conanExecutable.set(conanExecutable_)
    }
}

android {
    defaultConfig {
        // NOT the java package (see namespace below) but the app identity on google play
        // and f-droid, and it can never change: play has no rename path, so a new
        // applicationId is a new listing that existing installs never update to, losing
        // the install base, ratings and the pro entitlements. store-facing rebranding
        // goes through the listing title under fastlane/metadata instead.
        applicationId = "at.tomtasche.reader"
        minSdk = 26
        targetSdk = 36

        // derived from the tag above, and set here rather than in AndroidManifest.xml:
        // both spellings end up in the merged manifest, and this one wins, so keeping
        // the attributes there too would only leave a second number to disagree with
        versionCode = appVersion.code
        versionName = appVersion.name

        // likewise an applicationId, for the test apk. never published, so it is only
        // pinned here to keep it from drifting with the namespace.
        testApplicationId = "at.tomtasche.reader.test"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    flavorDimensions = ["default"]

    signingConfigs {
        if (hasReleaseSigning) {
            releasePro {
                storeFile = file(releaseKeystore.get())
                storePassword = releaseKeystorePassword.get()
                keyAlias = "reader-pro"
                keyPassword = releaseKeyPasswordPro.getOrElse(releaseKeystorePassword.get())
            }

            releaseLite {
                storeFile = file(releaseKeystore.get())
                storePassword = releaseKeystorePassword.get()
                keyAlias = "reader"
                keyPassword = releaseKeyPasswordLite.getOrElse(releaseKeystorePassword.get())
            }
        }
    }

    productFlavors {
        lite {
            if (hasReleaseSigning) {
                signingConfig = signingConfigs.releaseLite
            }

            resValue("bool", "DISABLE_TRACKING", "false")
        }

        pro {
            applicationIdSuffix = ".pro"
            versionNameSuffix = "-pro"

            if (hasReleaseSigning) {
                signingConfig = signingConfigs.releasePro
            }

            resValue("bool", "DISABLE_TRACKING", "true")
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.txt'
            ndk.debugSymbolLevel = "full"
        }
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    lint {
        // lint errors are build failures. NewApi in particular is the check that
        // would have caught the java.nio.file usage below minSdk that shipped for
        // years while this was switched off.
        abortOnError = true

        // warnings stay warnings for now - there is a backlog of them (unused
        // resources, typography, rtl) that is not worth blocking builds on
        warningsAsErrors = false

        // consumed by github code scanning, so findings show up inline on PRs
        sarifReport = true
        htmlReport = true
    }
    buildFeatures {
        buildConfig = true
        // AGP 9 makes resValue opt-in; the flavors use it for DISABLE_TRACKING
        resValues = true
    }
    // the java/kotlin package, R and BuildConfig. deliberately different from
    // applicationId above: this one is internal and free to rename, that one is not.
    // testNamespace is left to default to namespace + ".test".
    namespace = 'app.opendocument.droid'
    // ahead of targetSdk on purpose: compiling against newer APIs is independent of
    // opting in to their runtime behavior. androidx.core 1.19.0 requires 37.
    compileSdk = 37

    // TODO can and should this be architecture dependent?
    sourceSets.main.assets.srcDirs += "build/conan/armv8/assets"

    // libodr_jni.so (odrcore built with with_jni) plus the libc++_shared.so it links,
    // both put there per architecture by conandeployer.py. these used to be produced by
    // the app's own externalNativeBuild, which is gone now that the JNI layer comes
    // from the core itself
    sourceSets.main.jniLibs.srcDirs +=
            ["armv8", "armv7", "x86", "x86_64"].collect { "build/conan/${it}/jniLibs" }
}

dependencies {
    // the java side of odrcore's JNI bindings, taken from the same conan package that
    // built the libodr_jni.so deployed into jniLibs above. the two are one ABI with no
    // version negotiation, so sourcing both from one package is what keeps them in
    // step. the jar is architecture independent - armv8 just happens to be the copy we
    // read, like the assets source set above.
    implementation files(layout.buildDirectory.file("conan/armv8/libs/odr-core-java.jar")) {
        builtBy("conanInstall-armv8")
    }

    implementation libs.play.services.ads
    implementation libs.play.review
    implementation libs.user.messaging.platform

    implementation libs.androidx.appcompat
    implementation libs.androidx.core
    implementation libs.material
    implementation libs.androidx.webkit

    implementation libs.asset.extractor

    testImplementation libs.junit

    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.espresso.intents
    androidTestImplementation libs.androidx.test.rules
    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation libs.androidx.test.junit
    // only the debug variant of OpenFileIdling touches espresso, so the release apk
    // does not ship test infrastructure
    debugImplementation libs.espresso.idling.resource
    implementation libs.androidx.annotation
}
