[versions]
agp = "9.3.1"
conanAndroid = "0.9.6"
spotless = "8.8.0"
googleJavaFormat = "1.35.0"
ktfmt = "0.64"

# the java half of odrcore's JNI bindings is not versioned here: it comes out of the
# odrcore conan package pinned in app/conanfile.txt, which also builds the matching
# libodr_jni.so. see app/conandeployer.py.

androidxAnnotation = "1.10.0"
androidxAppcompat = "1.7.1"
androidxCore = "1.19.0"
androidxWebkit = "1.16.0"
androidxRecyclerview = "1.4.0"
androidxLifecycle = "2.9.4"
material = "1.14.0"

playServicesAds = "25.4.0"
playReview = "2.0.2"
userMessagingPlatform = "4.0.0"
assetExtractor = "1.3.3"

junit = "4.13.2"
espresso = "3.7.0"
androidxTest = "1.7.0"
androidxTestJunit = "1.3.0"

[libraries]
androidx-annotation ={ module = "androidx.annotation:annotation", version.ref = "androidxAnnotation" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidxAppcompat" }
androidx-core = { module = "androidx.core:core", version.ref = "androidxCore" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "androidxWebkit" }
# recyclerview and lifecycle already arrive transitively through material, but the landing
# screen and DocumentFragment's ViewModel compile against them - declaring them keeps a
# material bump from silently taking a compile dependency away
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "androidxRecyclerview" }
androidx-lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel", version.ref = "androidxLifecycle" }
androidx-lifecycle-livedata = { module = "androidx.lifecycle:lifecycle-livedata", version.ref = "androidxLifecycle" }
material = { module = "com.google.android.material:material", version.ref = "material" }

play-services-ads = { module = "com.google.android.gms:play-services-ads", version.ref = "playServicesAds" }
play-review = { module = "com.google.android.play:review", version.ref = "playReview" }
user-messaging-platform = { module = "com.google.android.ump:user-messaging-platform", version.ref = "userMessagingPlatform" }
asset-extractor = { module = "com.viliussutkus89:assetextractor-android", version.ref = "assetExtractor" }

junit = { module = "junit:junit", version.ref = "junit" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
espresso-intents = { module = "androidx.test.espresso:espresso-intents", version.ref = "espresso" }
espresso-contrib = { module = "androidx.test.espresso:espresso-contrib", version.ref = "espresso" }
espresso-idling-resource = { module = "androidx.test.espresso:espresso-idling-resource", version.ref = "espresso" }
androidx-test-rules = { module = "androidx.test:rules", version.ref = "androidxTest" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTest" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
conan-android = { id = "app.opendocument.conanandroidgradleplugin", version.ref = "conanAndroid" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
